name: Deploy Hive to Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: infra-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: read

    steps:
      - name: Request Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          test -n "$COOLIFY_API_TOKEN" || {
            echo "Missing COOLIFY_API_TOKEN repository secret."
            exit 1
          }

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --request GET \
            --url "https://deploy.techiveet.com/api/v1/deploy?uuid=z140ve7ehjoyuoluqk0azmwe&force=false" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN"
